<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة المحاماة والتدريب</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; text-align: center; }
        header { background-color: #1a252f; color: white; padding: 30px; border-radius: 8px; }
        .container { margin-top: 30px; display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; }
        .card { background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 280px; }
        .btn { display: inline-block; padding: 10px 18px; background-color: #18bc9c; color: white; text-decoration: none; border-radius: 5px; margin-top: 15px; font-weight: bold; }
        .btn:hover { background-color: #128f76; }
    </style>
</head>
<body>

    <header>
        <h1>منصة المحاماة والتدريب القانوني</h1>
        <p>دليلك للوصول إلى أفضل المحامين وزيادة فرص التدريب للمكاتب والمتدربين</p>
    </header>

    <div class="container">
        <div class="card">
            <h3>انضمام المحامين</h3>
            <p>سجل مكتبك معنا للانضمام لدليل المحامين والإعلان عن فرص التدريب.</p>
            <a href="register.html" class="btn">سجل بياناتك الآن</a>
        </div>

        <div class="card">
            <h3>دليل المحامين</h3>
            <p>ابحث عن محامي متخصص في منطقتك للحصول على استشارة قانونية.</p>
            <a href="#" class="btn">تصفح الدليل</a>
        </div>
    </div>

</body>
</html>
