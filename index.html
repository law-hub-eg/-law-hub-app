<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة العدالة للخدمات القانونية</title>
    <!-- Supabase JS Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary: #1e293b;
            --accent: #d97706;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
        }

        header {
            background-color: var(--primary);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--accent);
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--accent);
        }

        nav button {
            background: transparent;
            border: 1px solid var(--accent);
            color: var(--text);
            padding: 0.5rem 1rem;
            margin-right: 0.5rem;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.3s ease;
        }

        nav button:hover, nav button.active {
            background: var(--accent);
            color: white;
        }

        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .portal {
            display: none;
        }

        .portal.active {
            display: block;
        }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
            margin-top: 1.5rem;
        }

        .card {
            background: var(--card-bg);
            padding: 1.5rem;
            border-radius: 8px;
            border: 1px solid #334155;
        }

        .card h3 { color: var(--accent); margin-top: 0; }

        .btn-whatsapp {
            display: inline-block;
            background-color: #25d366;
            color: white;
            padding: 0.75rem 1.5rem;
            text-decoration: none;
            border-radius: 4px;
            margin-top: 1rem;
            font-weight: bold;
        }

        .admin-form {
            background: var(--card-bg);
            padding: 1.5rem;
            border-radius: 8px;
            margin-bottom: 2rem;
            border: 1px solid var(--accent);
        }

        .admin-form input, .admin-form select, .admin-form textarea {
            width: 100%;
            padding: 0.5rem;
            margin: 0.5rem 0 1rem;
            background: #334155;
            border: 1px solid #475569;
            color: white;
            border-radius: 4px;
            box-sizing: border-box;
        }

        .btn-submit {
            background: var(--accent);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            cursor: pointer;
            border-radius: 4px;
            font-weight: bold;
        }

        .btn-delete {
            background: #ef4444;
            color: white;
            border: none;
            padding: 0.4rem 0.8rem;
            cursor: pointer;
            border-radius: 4px;
            margin-top: 0.5rem;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">⚖️ منصة العدالة</div>
        <nav>
            <button onclick="switchPortal('client')" class="active">بوابة العملاء</button>
            <button onclick="switchPortal('lawyer')">دليل المحامين والتدريب</button>
            <button onclick="switchPortal('posts')">منشورات قانونية</button>
            <button onclick="promptAdmin()">لوحة التحكم (Admin)</button>
        </nav>
    </header>

    <div class="container">

        <!-- 1. بوابة العملاء -->
        <section id="portal-client" class="portal active">
            <h2>طلب استشارة قانونية</h2>
            <p>تواصل مع المستشار القانوني مباشرة عبر واتساب لتقييم قضيتك.</p>
            <a href="https://wa.me/201026256284?text=السلام%20عليكم،%20أرغب%20في%20طلب%20استشارة%20قانونية" target="_blank" class="btn-whatsapp">
                📱 تواصل عبر واتساب (01026256284)
            </a>
        </section>

        <!-- 2. بوابة المحامين والتدريب -->
        <section id="portal-lawyer" class="portal">
            <h2>دليل المحامين وفرص التدريب</h2>
            <div id="lawyers-list" class="card-grid">
                <!-- يتم التحميل ديناميكياً من Supabase -->
            </div>
        </section>

        <!-- 3. المنشورات القانونية -->
        <section id="portal-posts" class="portal">
            <h2>المنشورات والمقالات القانونية</h2>
            <div id="posts-list" class="card-grid">
                <!-- يتم التحميل ديناميكياً من Supabase -->
            </div>
        </section>

        <!-- 4. لوحة التحكم (Admin) -->
        <section id="portal-admin" class="portal">
            <h2>لوحة إدارة المنصة 🛠️</h2>

            <div class="admin-form">
                <h3>إضافة محامي / فرصة تدريب جديدة</h3>
                <input type="text" id="lawyer-name" placeholder="الاسم الكامل">
                <select id="lawyer-type">
                    <option value="lawyer">محامي ممارس</option>
                    <option value="training">فرصة تدريب قانوني</option>
                </select>
                <input type="text" id="lawyer-degree" placeholder="الدرجة العلمية / التخصص">
                <input type="text" id="lawyer-city" placeholder="المدينة">
                <input type="text" id="lawyer-address" placeholder="العنوان التفصيلي">
                <input type="text" id="lawyer-phone" placeholder="رقم الهاتف">
                <button onclick="addLawyer()" class="btn-submit">حفظ وإضافة</button>
            </div>

            <div class="admin-form">
                <h3>إضافة منشور قانوني جديد</h3>
                <input type="text" id="post-author" placeholder="اسم الكاتب / المستشار">
                <textarea id="post-content" rows="4" placeholder="محتوى المنشور القانوني..."></textarea>
                <button onclick="addPost()" class="btn-submit">نشر</button>
            </div>
        </section>

    </div>

    <script>
        // إعداد الاتصال بـ Supabase
        const SUPABASE_URL = "https://xhnombonshlyvzdmmnwt.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhobm9tYm9uc2hseXZ6ZG1tbnd0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc2NjEyODMsImV4cCI6MjEwMzIzNzI4M30.Ow_DFNo7Zxnv6DpdBPZxEOUBfRdThQ1of3OEThajF8I";
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let isAdmin = false;

        // التنقل بين البوابات
        function switchPortal(portalName) {
            document.querySelectorAll('.portal').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
            
            document.getElementById(`portal-${portalName}`).classList.add('active');
            
            if(portalName === 'lawyer') loadLawyers();
            if(portalName === 'posts') loadPosts();
        }

        // التحقق من كلمة مرور الأدمن
        function promptAdmin() {
            if(isAdmin) {
                switchPortal('admin');
                return;
            }
            const pass = prompt("أدخل كلمة مرور الإدارة:");
            if(pass === "231123") {
                isAdmin = true;
                alert("تم تسجيل الدخول كمسؤول بنجاح!");
                switchPortal('admin');
            } else if(pass !== null) {
                alert("كلمة المرور غير صحيحة!");
            }
        }

        // جلب المحامين من قاعدة البيانات
        async function loadLawyers() {
            const { data, error } = await supabase.from('lawyers').select('*');
            const container = document.getElementById('lawyers-list');
            container.innerHTML = '';

            if (error) return console.error(error);

            data.forEach(item => {
                container.innerHTML += `
                    <div class="card">
                        <h3>${item.name} (${item.type === 'training' ? 'فرصة تدريب' : 'محامي'})</h3>
                        <p><strong>التخصص:</strong> ${item.degree || 'غير محدد'}</p>
                        <p><strong>المدينة:</strong> ${item.city || '-'}</p>
                        <p><strong>العنوان:</strong> ${item.address || '-'}</p>
                        <p><strong>الهاتف:</strong> ${item.phone || '-'}</p>
                        ${isAdmin ? `<button onclick="deleteLawyer(${item.id})" class="btn-delete">حذف</button>` : ''}
                    </div>
                `;
            });
        }

        // إضافة محامي جديد
        async function addLawyer() {
            const name = document.getElementById('lawyer-name').value;
            const type = document.getElementById('lawyer-type').value;
            const degree = document.getElementById('lawyer-degree').value;
            const city = document.getElementById('lawyer-city').value;
            const address = document.getElementById('lawyer-address').value;
            const phone = document.getElementById('lawyer-phone').value;

            if(!name) return alert("يرجى إدخال الاسم!");

            const { error } = await supabase.from('lawyers').insert([{ name, type, degree, city, address, phone }]);
            if(error) alert("حدث خطأ أثناء الإضافة");
            else {
                alert("تمت الإضافة بنجاح!");
                loadLawyers();
            }
        }

        // حذف محامي
        async function deleteLawyer(id) {
            if(confirm("هل أنت متأكد من الحذف؟")) {
                await supabase.from('lawyers').delete().eq('id', id);
                loadLawyers();
            }
        }

        // جلب المنشورات
        async function loadPosts() {
            const { data, error } = await supabase.from('posts').select('*').order('created_at', { ascending: false });
            const container = document.getElementById('posts-list');
            container.innerHTML = '';

            if (error) return console.error(error);

            data.forEach(item => {
                container.innerHTML += `
                    <div class="card">
                        <h3>${item.author}</h3>
                        <p>${item.content}</p>
                        ${isAdmin ? `<button onclick="deletePost(${item.id})" class="btn-delete">حذف</button>` : ''}
                    </div>
                `;
            });
        }

        // إضافة منشور جديد
        async function addPost() {
            const author = document.getElementById('post-author').value;
            const content = document.getElementById('post-content').value;

            if(!author || !content) return alert("يرجى ملء جميع الحقول!");

            const { error } = await supabase.from('posts').insert([{ author, content }]);
            if(error) alert("حدث خطأ أثناء النشر");
            else {
                alert("تم النشر بنجاح!");
                loadPosts();
            }
        }

        // حذف منشور
        async function deletePost(id) {
            if(confirm("هل أنت متأكد من الحذف؟")) {
                await supabase.from('posts').delete().eq('id', id);
                loadPosts();
            }
        }

        // تحميل البيانات عند البداية
        loadLawyers();
    </script>
</body>
</html>
